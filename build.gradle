
plugins {
    id 'maven-publish'
    id 'application'
    id 'jacoco'
    id 'org.springframework.boot' version '4.1.1'
    id 'io.spring.dependency-management' version '1.1.7'
}
group = 'server.monitor'
version = '0.2'
publishing {
    publications {
        gpr(MavenPublication) {
            from components.java
        }
    }
    repositories {
        maven {
            name = 'GitHubPackages'
            url = uri('https://maven.pkg.github.com/EugenChornogorskiy/ServerMonitorBackend')
            credentials {
                username = System.getenv('USERNAME')
                password = System.getenv('TOKEN')
            }
        }
    }
}
jacoco {
    toolVersion = '0.8.13'
}
repositories {
    mavenCentral()
}
configurations {
    mockitoAgent
}
dependencies {
    testImplementation libs.junit.jupiter
    runtimeOnly 'org.postgresql:postgresql'
    implementation 'org.springframework.boot:spring-boot-starter-restclient'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    testImplementation 'org.springframework.boot:spring-boot-starter-restclient-test'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    implementation 'org.springframework.boot:spring-boot-starter-webmvc'
    testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
    mockitoAgent('org.mockito:mockito-core') {
        transitive = false
    }
    implementation libs.guava
}
java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

application {
    mainClass = 'server.monitor.backend.ServerMonitor'
}

tasks.named('test') {
    useJUnitPlatform()
    jvmArgs += ["-javaagent:${configurations.mockitoAgent.asPath}", '-Xshare:off']
    testLogging {
        events 'passed', 'failed'
    }
    finalizedBy jacocoTestReport
}
tasks.named('jacocoTestReport') {
    dependsOn test
    reports {
        html.required = true
        xml.required = false
    }
}
