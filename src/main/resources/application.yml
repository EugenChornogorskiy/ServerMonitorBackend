spring:
  main:
    banner-mode: off
  http:
    clients:
      connect-timeout: 1s
      read-timeout: 1s
  datasource:
    url: jdbc:postgresql://localhost:5432/ServerMonitor
    username: postgres
    password: 1777
logging:
  level:
    root: warn
    org.springframework.boot.web.embedded.tomcat: info
    server.monitor.backend: info
server-monitor:
    http-key: "mykey"
server:
  port: 3001
claim:
  timeout-minutes: 1